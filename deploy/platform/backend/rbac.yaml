apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeai-backend
  namespace: kubeai-training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeai-backend-volcano
  namespace: kubeai-training
rules:
  - apiGroups:
      - batch.volcano.sh
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeai-backend-volcano
  namespace: kubeai-training
subjects:
  - kind: ServiceAccount
    name: kubeai-backend
    namespace: kubeai-training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeai-backend-volcano