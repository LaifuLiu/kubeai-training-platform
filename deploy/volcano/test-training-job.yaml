apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: volcano-test-training-hh
  namespace: kubeai-training
  annotations:
    volcano.sh/preemptable: "true"
  labels:
    kubeai.io/managed-by: kubeai
    kubeai.io/component: training
spec:
  schedulerName: volcano
  queue: ai-training
  priorityClassName: kubeai-high
  tasks:
    - name: trainer
      replicas: 1
      template:
        metadata:
          labels:
            kubeai.io/managed-by: kubeai
            kubeai.io/component: training
        spec:
          restartPolicy: Never
          priorityClassName: kubeai-high
          containers:
            - name: busybox
              image: busybox:1.36
              command: ["sh", "-c", "echo 'BusyBox started'; sleep 500; echo 'BusyBox finished'"]
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "3000m"
                  memory: 1Gi