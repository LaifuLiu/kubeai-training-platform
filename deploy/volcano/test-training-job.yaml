apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: volcano-test-training-high
  namespace: kubeai-training
  labels:
    kubeai.io/managed-by: kubeai
    kubeai.io/component: training
spec:
  schedulerName: volcano
  queue: ai-training
  minAvailable: 1
  maxRetry: 0
  priorityClassName: kubeai-high
  tasks:
    - name: trainer
      replicas: 1
      template:
        metadata:
          labels:
            kubeai.io/managed-by: kubeai
            kubeai.io/component: training
        spec:
          restartPolicy: Never
          containers:
            - name: busybox
              image: busybox:1.36
              command: ["sh", "-c", "echo 'BusyBox started'; sleep 100; echo 'BusyBox finished'"]
              imagePullPolicy: IfNotPresent
              # env:
              #   - name: EPOCHS
              #     value: "5"
              #   - name: SEED
              #     value: "42"
              resources:
                requests:
                  cpu: "3"
                  memory: 1Gi
                # limits:
                #   cpu: "2"
                #   memory: 3Gi