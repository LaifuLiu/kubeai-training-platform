apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: priority-normal-test
  namespace: kubeai-training
  labels:
    kubeai.io/managed-by: kubeai
    kubeai.io/component: priority-test
spec:
  schedulerName: volcano
  queue: ai-training
  minAvailable: 1
  maxRetry: 0
  tasks:
    - name: trainer
      replicas: 1
      template:
        metadata:
          labels:
            kubeai.io/managed-by: kubeai
            kubeai.io/component: priority-test
        spec:
          nodeSelector:
            kubernetes.io/hostname: worker1
          priorityClassName: kubeai-normal
          restartPolicy: Never
          containers:
            - name: trainer
              image: busybox:1.36
              command: ["sh", "-c", "sleep 60"]
              resources:
                requests:
                  cpu: "2"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 1Gi
---
