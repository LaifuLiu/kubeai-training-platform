apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: priority-blocker
  namespace: kubeai-training
  labels:
    kubeai.io/managed-by: kubeai
    kubeai.io/component: priority-test
spec:
  schedulerName: volcano
  queue: ai-training
  minAvailable: 1
  maxRetry: 0
  tasks:
    - name: blocker
      replicas: 1
      template:
        metadata:
          labels:
            kubeai.io/managed-by: kubeai
            kubeai.io/component: priority-test
        spec:
          nodeSelector:
            kubernetes.io/hostname: worker1
          restartPolicy: Never
          containers:
            - name: blocker
              image: busybox:1.36
              command: ["sh", "-c", "sleep 600"]
              resources:
                requests:
                  cpu: "3"
                  memory: 4Gi
                limits:
                  cpu: "3"
                  memory: 4Gi