apiVersion: batch/v1
kind: Job
metadata:
  name: volcano-test-training-normal
  namespace: kubeai-training
  annotations:
    volcano.sh/preemptable: "true"
  labels:
    kubeai.io/managed-by: kubeai
    kubeai.io/component: training
spec:
  template:
    metadata:
      annotations:
          scheduling.volcano.sh/queue-name: "ai-training"
      labels:
        kubeai.io/managed-by: kubeai
        kubeai.io/component: training
    spec:
      restartPolicy: Never
      priorityClassName: kubeai-normal
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c", "echo 'BusyBox started'; sleep 500; echo 'BusyBox finished'"]
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "3000m"
              memory: 1Gi